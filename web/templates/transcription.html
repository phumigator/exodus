<!DOCTYPE html>
<html lang="{{ g.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('transcription_page_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pipboy-page">
    {% include "_nav.html" %}
    <header>
        <h1>{{ t('transcription_header_title') }}</h1>
        <p>{{ t('transcription_header_subtitle') }}</p>
    </header>
    <main>
        <div class="model-select-row">
            <label for="model-select">{{ t('model_select_label') }}</label>
            <select id="model-select">
                <option value="nvidia/nemotron-3-ultra-550b-a55b:free">NVIDIA Nemotron 3 Ultra (free)</option>
                <option value="nvidia/nemotron-3-super-120b-a12b:free">NVIDIA Nemotron 3 Super (free)</option>
                <option value="cohere/north-mini-code:free">Cohere North Mini Code (free)</option>
                <option value="inclusionai/ling-3.0-flash:free">Ling-3.0-flash (free)</option>
                <option value="openai/gpt-oss-20b:free">OpenAI gpt-oss-20b (free)</option>
                <option value="google/gemma-4-26b-a4b-it:free">Google Gemma 4 26B A4B (free)</option>
            </select>
        </div>

        <form id="upload-form" class="transcription-form">
            <input type="file" id="file-input" name="file" accept="audio/*,video/*" required>
            <button type="submit" id="transcribe-btn">{{ t('transcribe_btn') }}</button>
        </form>

        <p id="status" class="status" hidden></p>

        <section id="transcript-section" hidden>
            <h2>{{ t('transcript_heading') }}</h2>
            <textarea id="transcript" rows="10"></textarea>
            <div class="button-row">
                <button type="button" id="download-transcript-btn">{{ t('download_transcript_btn') }}</button>
            </div>
            <label for="correction-prompt-input">{{ t('correction_prompt_label') }}</label>
            <textarea id="correction-prompt-input" rows="8">{{ t('correction_prompt_default') }}</textarea>
            <div class="button-row">
                <button type="button" id="correct-btn">{{ t('correct_btn') }}</button>
            </div>
            <label for="summary-prompt-input">{{ t('summary_prompt_label') }}</label>
            <textarea id="summary-prompt-input" rows="6">{{ t('summary_prompt_default') }}</textarea>
            <div class="button-row">
                <button type="button" id="summarize-btn">{{ t('summarize_btn') }}</button>
            </div>
        </section>

        <section id="summary-section" hidden>
            <h2>{{ t('summary_heading') }}</h2>
            <div id="summary" class="summary-box"></div>
            <div class="button-row">
                <button type="button" id="download-summary-btn">{{ t('download_summary_btn') }}</button>
            </div>
        </section>

        <section id="chat-section">
            <h2>{{ t('chat_heading') }}</h2>
            <div class="button-row">
                <button type="button" id="chat-clear-btn">{{ t('chat_clear_btn') }}</button>
            </div>
            <div id="chat-history" class="chat-history"></div>
            <form id="chat-form" class="chat-form">
                <textarea id="chat-input" rows="2" placeholder="{{ t('chat_input_placeholder') }}" required></textarea>
                <button type="submit" id="chat-send-btn">{{ t('chat_send_btn') }}</button>
            </form>
            <p id="chat-status" class="status" hidden></p>
        </section>
    </main>
    <footer>
        Phumigator Exodus &mdash; <a href="/about">{{ t('footer_about_link') }}</a>
    </footer>

    <script>
        const API_BASE_URL = {{ api_base_url | tojson }};
        const I18N = {{ i18n_json | tojson }};
    </script>
    <script src="{{ url_for('static', filename='transcription.js') }}"></script>
</body>
</html>
