<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Транскрибация и суммаризация — Phumigator Exodus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pipboy-page">
    {% include "_nav.html" %}
    <header>
        <h1>🎙️ Транскрибация и суммаризация</h1>
        <p>Загрузите аудио или видео — получите текст и краткую выжимку</p>
    </header>
    <main>
        <form id="upload-form" class="transcription-form">
            <input type="file" id="file-input" name="file" accept="audio/*,video/*" required>
            <label for="correction-prompt-input">Промпт коррекции распознанного текста:</label>
            <textarea id="correction-prompt-input" rows="8">Ты корректор транскрипций. На вход подаётся сырой текст, распознанный речевым движком (Whisper) — в нём встречаются ошибки распознавания: неверно услышанные слова, пропущенные/лишние знаки препинания, неправильная сегментация предложений, слитые или разорванные слова. Твоя задача — только исправить эти ошибки распознавания речи, восстановив наиболее вероятный исходный текст.

Строго соблюдай:
1. Не думай вслух, не показывай рассуждения — сразу выдай финальный результат.
2. Не добавляй ничего от себя: ни новых фактов, ни пояснений, ни оценок, ни предупреждений о недостатке контекста.
3. Не суммаризируй и не сокращай — длина и структура текста должны остаться теми же, меняются только ошибочные слова и пунктуация.
4. Сохраняй исходный язык, стиль и смысл текста как есть, даже если он разговорный, незаконченный или бессвязный.
5. Если текст пустой или уже корректен — верни его без изменений.
6. Ответ должен содержать только исправленный текст, без кавычек, префиксов вроде "Исправленный текст:" и без markdown-разметки.</textarea>
            <button type="submit" id="transcribe-btn">Распознать речь</button>
        </form>

        <p id="status" class="status" hidden></p>

        <section id="transcript-section" hidden>
            <h2>Расшифровка</h2>
            <textarea id="transcript" rows="10"></textarea>
            <button type="button" id="summarize-btn">Суммаризировать</button>
        </section>

        <section id="summary-section" hidden>
            <h2>Краткая выжимка</h2>
            <div id="summary" class="summary-box"></div>
        </section>

        <section id="chat-section">
            <h2>Чат с моделью OpenRouter</h2>
            <div class="chat-model-row">
                <label for="chat-model">Модель:</label>
                <select id="chat-model">
                    <option value="google/gemma-4-31b-it:free" disabled>Google Gemma 4 31B (нестабильно)</option>
                    <option value="nvidia/nemotron-3-ultra-550b-a55b:free">NVIDIA Nemotron 3 Ultra (free)</option>
                    <option value="nvidia/nemotron-3-super-120b-a12b:free">NVIDIA Nemotron 3 Super (free)</option>
                    <option value="poolside/laguna-m.1:free">Poolside Laguna M.1 (free)</option>
                    <option value="cohere/north-mini-code:free">Cohere North Mini Code (free)</option>
                </select>
                <button type="button" id="chat-clear-btn">Очистить чат</button>
            </div>
            <div id="chat-history" class="chat-history"></div>
            <form id="chat-form" class="chat-form">
                <textarea id="chat-input" rows="2" placeholder="Введите сообщение..." required></textarea>
                <button type="submit" id="chat-send-btn">Отправить</button>
            </form>
            <p id="chat-status" class="status" hidden></p>
        </section>
    </main>
    <footer>
        Phumigator Exodus &mdash; <a href="/about">о разработчике</a>
    </footer>

    <script>
        const API_BASE_URL = {{ api_base_url | tojson }};
    </script>
    <script src="{{ url_for('static', filename='transcription.js') }}"></script>
</body>
</html>
