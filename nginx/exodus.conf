# Reverse-proxy конфигурация Exodus.
#
# - web (Flask + Dash, gunicorn)  -> 127.0.0.1:8888
# - api (FastAPI, uvicorn)        -> 127.0.0.1:8000
#
# Установить в /etc/nginx/sites-available/exodus.conf и сделать симлинк
# в /etc/nginx/sites-enabled/, затем заменить server_name на свой домен.

upstream exodus_web {
    server 127.0.0.1:8888;
}

upstream exodus_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name example.com;

    client_max_body_size 1G;

    # FastAPI: транскрибация и аналитика, доступны под /api/
    location /api/ {
        proxy_pass http://exodus_api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        # Долгие запросы транскрибации/суммаризации (большие файлы)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Unity WebGL-сборки игр (см. web/games.py). Папку указать ту же,
    # что в EXODUS_GAMES_DIR у web-сервиса, со слешем на конце.
    # Unity кладёт файлы уже сжатыми (.br/.gz): nginx должен отдать их
    # как есть с Content-Encoding и MIME исходного типа, иначе загрузчик
    # Unity падает с ошибкой про неправильно настроенный сервер.
    location ^~ /games-build/ {
        alias /var/www/exodus-games/;
        types {
            application/javascript js;
            application/wasm wasm;
            application/octet-stream data unityweb;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        gzip off;

        location ~ \.js\.br$ {
            types { } default_type application/javascript;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=3600";
        }
        location ~ \.wasm\.br$ {
            types { } default_type application/wasm;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=3600";
        }
        location ~ \.(data|symbols\.json)\.br$ {
            types { } default_type application/octet-stream;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=3600";
        }
        location ~ \.js\.gz$ {
            types { } default_type application/javascript;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=3600";
        }
        location ~ \.wasm\.gz$ {
            types { } default_type application/wasm;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=3600";
        }
        location ~ \.(data|symbols\.json)\.gz$ {
            types { } default_type application/octet-stream;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # Flask + смонтированный Dash-дашборд (/, /about, /zcyc/)
    location / {
        proxy_pass http://exodus_web;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dash использует websocket для hot-reload/обновлений
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
