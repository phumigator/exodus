# Reverse-proxy конфигурация Exodus.
#
# - web (Flask + Dash, gunicorn)  -> 127.0.0.1:8888
# - api (FastAPI, uvicorn)        -> 127.0.0.1:8000
#
# Установить в /etc/nginx/sites-available/exodus.conf и сделать симлинк
# в /etc/nginx/sites-enabled/, затем заменить server_name на свой домен.

upstream exodus_web {
    server 127.0.0.1:8888;
}

upstream exodus_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name example.com;

    client_max_body_size 200M;

    # FastAPI: транскрибация и аналитика, доступны под /api/
    location /api/ {
        proxy_pass http://exodus_api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        # Долгие запросы транскрибации/суммаризации
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Flask + смонтированный Dash-дашборд (/, /about, /zcyc/)
    location / {
        proxy_pass http://exodus_web;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dash использует websocket для hot-reload/обновлений
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
